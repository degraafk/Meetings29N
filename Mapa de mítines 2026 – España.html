<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mítines 2026 · España</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
--bg:#f4f5f7;--ink:#12161c;--muted:#667085;--hair:#e3e6eb;--land:#d3d9e2;--hover:#e9ecf1;
--vox:#4a9a2a;--pp:#2b6cb0;--psoe:#d7263d;
--font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1680px;margin:0 auto;padding:clamp(12px,1.8vw,24px)}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 32px;margin-bottom:clamp(6px,1vw,12px)}
h1{margin:0;font-size:clamp(1.9rem,4vw,2.8rem);line-height:1;font-weight:700;letter-spacing:-.035em}
.sub{margin:8px 0 0;color:var(--muted);font-size:.98rem}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--hair);border-radius:999px;background:#fff;font-size:.9rem;font-weight:500;transition:background .15s,border-color .15s,opacity .15s}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{opacity:.45;background:transparent}
.tool{padding:8px 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:.88rem;font-weight:500}
.tool[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
.chip:focus-visible,.tool:focus-visible,.row:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:clamp(16px,2vw,28px);align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
svg#map{width:100%;height:auto;display:block;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.mapwrap{position:relative}
.zoom{position:absolute;right:4px;top:4px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--hair);background:#fff;border-radius:8px;font-size:19px;line-height:1;color:var(--ink);padding:0}
.zoom button:hover{background:var(--hover)}
.zoom button:disabled{opacity:.4;cursor:default}
.zoom button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.land{fill:var(--land);stroke:var(--bg);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.inset{fill:none;stroke:#b8bfcb;stroke-width:1.2;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.inset-t{fill:var(--muted);font-family:var(--font)}
.lbl{font-family:var(--font);font-weight:400;fill:var(--ink);pointer-events:none}
.pin{cursor:pointer}
.pin circle{transition:transform .15s}
.pin.on .dotc{transform-box:fill-box;transform-origin:center;transform:scale(1.5)}
.pin.on .lbl{font-weight:600}
aside{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;overflow-x:hidden;padding:0 8px;margin:0 -8px;scrollbar-width:thin}
@media(max-width:860px){aside{position:static;max-height:none;overflow:visible}}
.sum{flex:none;margin-bottom:6px}
.sum-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--muted);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600;margin-bottom:10px}
.sum-h .k{display:flex;gap:12px;text-transform:none;letter-spacing:0;font-weight:500;font-size:.74rem}
.sum-h .k span{display:inline-flex;align-items:center;gap:5px}
.kq{width:9px;height:9px;border-radius:2.5px;display:inline-block}
.total{display:flex;align-items:baseline;gap:10px}
.total b{font-size:2.9rem;line-height:1;letter-spacing:-.04em;font-weight:700;font-variant-numeric:tabular-nums}
.total span{color:var(--muted);font-size:.9rem}
.bar{display:flex;gap:3px;height:10px;margin:14px 0 6px}
.bar i{display:block;border-radius:5px;min-width:8px}
.ps{padding:13px 0;border-top:1px solid var(--hair)}
.ps-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ps-top .dot{width:9px;height:9px;border-radius:50%}
.ps-top .nm{font-weight:600;font-size:.92rem}
.ps-top .ct{margin-left:auto;font-size:1.55rem;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.waffle{display:flex;flex-wrap:wrap;gap:3px}
.sq{width:11px;height:11px;border-radius:3px;cursor:pointer;transition:transform .12s}
.sq:hover{transform:scale(1.3)}
.ps-sub{margin-top:9px;color:var(--muted);font-size:.8rem}
.cc-wrap{padding:13px 0 4px;border-top:1px solid var(--hair)}
.cc-wrap .sum-h{margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--hair);border-radius:999px;font-size:.8rem;background:#fff;font-weight:500}
.cc .dot{width:7px;height:7px;border-radius:50%}
.legend{display:flex;gap:14px;margin:2px 0 4px;color:var(--muted);font-size:.74rem}
.legend span{display:inline-flex;align-items:center;gap:5px}
.detail{margin-top:clamp(36px,5vw,72px);padding-top:clamp(20px,3vw,32px);border-top:1px solid var(--hair)}
.detail .list-h{margin:0 0 20px;padding:0;border:0}
#lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px clamp(24px,4vw,56px);align-items:start}
.list-h{margin:14px 0 4px;padding-top:16px;border-top:1px solid var(--hair)}
.party{margin-bottom:28px}
.party h2{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:.95rem;font-weight:600;letter-spacing:-.005em}
.party h2 .dot{width:10px;height:10px;border-radius:50%}
.party h2 span.c{color:var(--muted);font-weight:500}
.row{display:flex;align-items:baseline;gap:12px;padding:9px 8px;margin:0 -8px;border-top:1px solid var(--hair);border-radius:6px;cursor:default;font-size:.95rem}
.row:first-of-type{border-top:0}
.row .n{flex:none;width:1.5em;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.row .t{font-weight:500}
.row .p{margin-left:auto;color:var(--muted);font-size:.85rem;text-align:right}
.row:hover,.row.on{background:var(--hover)}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 18px;color:var(--muted);font-size:.82rem}
.key span{display:inline-flex;align-items:center;gap:7px}
.k{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}
.k.d{background:var(--bg);box-shadow:inset 0 0 0 1.7px var(--muted)}
.row .x{display:block;margin-top:2px;color:var(--muted);font-size:.8rem;font-weight:400}
.empty{color:var(--muted);font-size:.9rem;margin:0 0 4px}
.add{border:0;border-radius:999px;padding:9px 16px;background:var(--ink);color:#fff;font-size:.9rem;font-weight:600}
.add:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.del{margin-left:6px;border:0;background:transparent;color:var(--muted);font-size:1.15rem;line-height:1;padding:0 4px;opacity:0;align-self:center}
.row:hover .del,.del:focus-visible{opacity:1}
dialog{border:1px solid var(--hair);border-radius:16px;padding:0;width:min(440px,calc(100vw - 32px));color:var(--ink);background:#fff;font-family:var(--font)}
dialog::backdrop{background:rgba(18,22,28,.4)}
.dl{padding:24px}
.dl h3{margin:0 0 18px;font-size:1.25rem;letter-spacing:-.02em}
.dl label,.dl .lab{display:block;margin:16px 0 7px;font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.dl label em,.dl .lab em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--hair);border-radius:999px;background:transparent;font-size:.9rem;font-weight:500}
.opt .dot{width:9px;height:9px;border-radius:50%}
.opt[aria-checked="true"]{border-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dl input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;font:inherit;font-size:.95rem;color:var(--ink);background:#fff}
.dl input[type=text]:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}
.st{margin:8px 0 0;font-size:.82rem;color:var(--muted);min-height:1.2em}
.st.err{color:var(--psoe)}
.lnk{border:0;background:transparent;padding:0;color:var(--ink);font-size:.82rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.btn{border:1px solid var(--hair);background:#fff;border-radius:999px;padding:9px 18px;font-weight:600;font-size:.9rem}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.dl .nt{margin:14px 0 0;font-size:.76rem;color:var(--muted)}
.banner{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:.9rem;font-weight:500;z-index:20;display:none}
footer{margin-top:clamp(24px,4vw,48px);color:var(--muted);font-size:.78rem}
</style>
</head>

}

svg.addEventListener('click',function(e){
  if(!PICK||!downAt||Math.abs(e.clientX-downAt[0])>4||Math.abs(e.clientY-downAt[1])>4)return;
  var q=rel(e),ll=unP(view.x+q[0]*view.w,view.y+q[1]*view.h);
  F.pos={lat:ll[0],lon:ll[1],prov:'',fromMap:true};endPick();status('Posición elegida en el mapa');
});
function endPick(){PICK=false;banner.style.display='none';svg.style.cursor='';dlg.showModal();}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&PICK){endPick();}});
var ab=document.createElement('button');ab.type='button';ab.className='add';ab.textContent='+ Añadir acto';ab.onclick=openDlg;c.appendChild(ab);
refreshAll();
</script>
</body>
